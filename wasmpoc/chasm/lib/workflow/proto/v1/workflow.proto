syntax = "proto3";

package temporal.server.wasmpoc.chasm.lib.workflow.proto.v1;

option go_package = "go.temporal.io/server/wasmpoc/chasm/lib/workflow/gen/workflowpb;workflowpb";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

enum WorkflowStatus {
  WORKFLOW_STATUS_UNSPECIFIED = 0;
  WORKFLOW_STATUS_RUNNING = 1;
  WORKFLOW_STATUS_COMPLETED = 2;
  WORKFLOW_STATUS_FAILED = 3;
}

message WorkflowState {
  WorkflowStatus status = 1;
  string workflow_type = 2;
  string task_queue = 3;
  google.protobuf.Duration workflow_task_timeout = 4;
  google.protobuf.Timestamp start_time = 5;
  // ID the next history event will get.
  int64 next_event_id = 6;
  // Non-zero while a workflow task is scheduled or started.
  int64 workflow_task_scheduled_event_id = 7;
  // Non-zero while a workflow task is started.
  int64 workflow_task_started_event_id = 8;
  // Started event ID of the last completed workflow task; sent to the worker as previous_started_event_id.
  int64 last_completed_workflow_task_started_event_id = 9;
  int32 workflow_task_attempt = 10;
  // Incremented each time a workflow task is scheduled; fences stale dispatch tasks.
  int32 workflow_task_stamp = 11;
  // Total serialized size of history events, reported in WorkflowTaskStarted.
  int64 history_size_bytes = 12;
}

enum TimerStatus {
  TIMER_STATUS_UNSPECIFIED = 0;
  TIMER_STATUS_STARTED = 1;
  TIMER_STATUS_FIRED = 2;
  TIMER_STATUS_CANCELED = 3;
}

message TimerState {
  TimerStatus status = 1;
  string timer_id = 2;
  int64 started_event_id = 3;
  google.protobuf.Timestamp fire_time = 4;
}

message TimerFireTask {}

message WorkflowTaskDispatchTask {
  int32 stamp = 1;
}
