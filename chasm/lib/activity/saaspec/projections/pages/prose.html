<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAA — docs prose</title>
<style>
  body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#1c2024}
  h1{font-size:1.5rem} h2{font-size:1.15rem;margin-top:1.6rem} .lead{color:#606770} a{color:#2d6cdf}
  table{border-collapse:collapse;margin:1rem 0;font-size:.94rem}
  th,td{border:1px solid #e3e6ea;padding:.45rem .7rem;text-align:left}
  th{background:#f6f8fa}
  code{background:#f2f4f7;padding:.1em .35em;border-radius:4px;font-size:.9em}
  pre{white-space:pre-wrap}
</style>
</head>
<body>
<p><a href="../">&larr; SAA behavior projections</a></p>
<h1>Docs prose</h1>
<p class="lead">Markdown generated for the documentation site
(<code>docs/encyclopedia/activities/activity-operations.mdx</code>), from the same spec-derived
classification as the diagram. Source: <a href="../operations.md">operations.md</a>. Rendered below.</p>
<hr>
<div id="content"></div>
<!-- operations.md is inlined here at build time so the page renders over file:// (no fetch). -->
<script id="md" type="text/plain">
@@MARKDOWN@@
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const src = document.getElementById('md').textContent;
  const el = document.getElementById('content');
  if (window.marked) el.innerHTML = marked.parse(src);
  else el.innerHTML = '<pre></pre>', el.firstChild.textContent = src;
</script>
</body>
</html>
